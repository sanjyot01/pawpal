#version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL: Persistent Storage for Health Ledgers & Users
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pet-social-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: pet_social_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ----------------------------------------------------
  # Redis Stack: In-Memory Datastore & GUI for Geo-Math
  # ----------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: pet-social-redis
    ports:
      - "6379:6379"   # Engine
      - "8001:8001"   # RedisInsight GUI
    restart: unless-stopped

  # ----------------------------------------------------
  # Apache Kafka (KRaft Mode): Telemetry Message Broker
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pet-social-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # ----------------------------------------------------
  # Prometheus: metrics scraper
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pet-social-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ----------------------------------------------------
  # Grafana: dashboard visualization
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:9.0.0
    container_name: pet-social-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data: