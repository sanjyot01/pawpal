# NODE A (Kafka broker + Redis replica + app instance)
#
#   docker compose --env-file .env -f docker-compose.node-a.yml up -d
#
# Bring node B up first: the replica here needs a primary to attach to.
#
# This node also owns schema migrations. Running Flyway from both instances at
# once would have them race for the same lock on startup, so node B sets
# FLYWAY_ENABLED=false and this one does not.

services:
  # --------------------------------------------------------------------------
  # Kafka (KRaft, single broker). Replication factor is 1 — a broker loss stops
  # telemetry ingestion until it returns. Fixing that means MSK or a 3-broker
  # quorum, which is Phase 2; see SCALABILITY_REVIEW_2026-08-09.md.
  #
  # Partition count is NOT set here: KafkaTopicConfig declares it in code
  # (app.kafka.telemetry-partitions) so partitions and listener concurrency
  # cannot drift apart, which is the bug the 2026-06-16 session root-caused.
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pawpal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${NODE_A_IP}:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      # Node B's app connects over EXTERNAL, so this must advertise the private
      # IP rather than localhost — otherwise remote consumers get sent to themselves.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${NODE_A_IP}:29092,EXTERNAL://${NODE_A_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis replica. Exists for failover, not read scaling — the app sends all
  # traffic through Sentinel to whichever node currently holds the primary role.
  # --------------------------------------------------------------------------
  redis-replica:
    image: redis/redis-stack-server:latest
    container_name: pawpal-redis-replica
    network_mode: host
    command: >
      redis-server
      --port 6379
      --replicaof ${NODE_B_IP} 6379
      --replica-announce-ip ${NODE_A_IP}
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Sentinel #2 of 3.
  # --------------------------------------------------------------------------
  sentinel:
    image: redis:7-alpine
    container_name: pawpal-sentinel-a
    network_mode: host
    depends_on:
      - redis-replica
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<EOF
        port 26379
        sentinel monitor ${REDIS_MASTER_NAME} ${NODE_B_IP} 6379 2
        sentinel down-after-milliseconds ${REDIS_MASTER_NAME} 5000
        sentinel failover-timeout ${REDIS_MASTER_NAME} 10000
        sentinel parallel-syncs ${REDIS_MASTER_NAME} 1
        sentinel announce-ip ${NODE_A_IP}
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    restart: unless-stopped

  app:
    image: ${APP_IMAGE}
    container_name: pawpal-app-a
    ports:
      - "8080:8080" # reachable only from the ALB security group
    environment:
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/pet_social_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_SENTINEL_MASTER: ${REDIS_MASTER_NAME}
      SPRING_DATA_REDIS_SENTINEL_NODES: ${NODE_A_IP}:26379,${NODE_B_IP}:26379,${WITNESS_IP}:26379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${NODE_A_IP}:9092
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_TEST_ENDPOINTS_ENABLED: "false"
      MGMT_ENDPOINTS: health,info,prometheus
      MGMT_PROMETHEUS_ENABLED: "true"
      FLYWAY_ENABLED: "true" # this node owns migrations
    depends_on:
      - kafka
      - redis-replica
    restart: unless-stopped

volumes:
  kafka_data:
  redis_data:
