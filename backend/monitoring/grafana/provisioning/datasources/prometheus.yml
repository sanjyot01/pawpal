# Provisioned at startup so a fresh Grafana container comes up already pointed at
# Prometheus — nobody has to click through "Add data source" mid-demo.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed uid so the committed dashboard JSON can reference this datasource by name
    # instead of the random uid a manually-added datasource would get.
    uid: pawpal-prometheus
    access: proxy
    # Compose service name; Prometheus publishes no host port.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
