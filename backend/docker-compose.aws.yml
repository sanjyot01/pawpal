# Full PawPal stack for a single AWS EC2 instance (infra + Spring Boot app).
# Usage on the server:  docker compose -f docker-compose.aws.yml up -d --build
# Local dev keeps using docker-compose.yml (infra only) + mvnw spring-boot:run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-social-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: pet_social_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    # Plain Redis, not redis-stack: the app only uses core commands (GEO, HASH,
    # STRING, ZSET, SCAN) and never the Stack modules. redis-stack is 1.42 GB and
    # bundles a GUI this deployment doesn't even publish a port for; alpine is 61 MB.
    # Local dev keeps redis-stack in docker-compose.yml for the RedisInsight GUI.
    image: redis:7-alpine
    container_name: pet-social-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pet-social-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  app:
    build: .
    container_name: pet-social-app
    ports:
      - "8080:8080" # the ONLY port exposed to the internet
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pet_social_db
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Never inline this. It signs every session token, so anyone who can read it can
      # forge a token for any user. It lives in .env (gitignored) or SSM; the :? makes
      # compose refuse to start rather than silently fall back to a shared default.
      APP_JWT_SECRET: "${APP_JWT_SECRET:?set APP_JWT_SECRET in .env - generate one with 'openssl rand -base64 48'}"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      # This box is internet-reachable: keep the unauthenticated load-generation and
      # Redis-introspection endpoints off. Set to "true" temporarily to run a load test.
      APP_TEST_ENDPOINTS_ENABLED: "false"
      # Metrics for the Prometheus/Grafana pair below. Safe to expose here because
      # /actuator/prometheus is only reachable on the compose network — port 8080 is
      # published, but Prometheus scrapes app:8080 without going through it.
      MGMT_ENDPOINTS: health,info,prometheus
      MGMT_PROMETHEUS_ENABLED: "true"
      # Connections arrive straight off the internet, so the socket address is the real
      # client. Flip to "true" only if something that rewrites X-Forwarded-For is put in
      # front (an ALB), or the login limiter becomes bypassable with a forged header.
      APP_RATELIMIT_TRUST_FORWARDED_FOR: "false"
      # POST /api/demo/seed. Leave false except while actually seeding — it writes accounts.
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-false}
      APP_DEMO_SEED_PASSWORD: ${APP_DEMO_SEED_PASSWORD:-pawpal-demo}
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: pet-social-prometheus
    volumes:
      - ./monitoring/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Deliberately no published port: Grafana reaches it over the compose network, and
    # Prometheus has no authentication of its own to put on a public interface.
    restart: unless-stopped
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pet-social-grafana
    ports:
      # Restrict this to your own IP in the security group — it is a login page on the
      # public internet, unlike the metrics it renders.
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default: an admin password baked into a committed compose file is the same
      # password on every deployment that ever copies it.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env - generate one with 'openssl rand -base64 24'}"
      # Nobody signs up for a demo dashboard; the admin account is the only account.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
